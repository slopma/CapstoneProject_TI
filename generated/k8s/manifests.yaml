apiVersion: apps/v1
kind: Deployment
metadata:
  name: datacenter-on-premise-principal
  labels:
    app: datacenter-on-premise-principal
    managed-by: cloudmove
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datacenter-on-premise-principal
  template:
    metadata:
      labels:
        app: datacenter-on-premise-principal
    spec:
      containers:
      - name: datacenter-on-premise-principal
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: datacenter-on-premise-principal-svc
spec:
  selector:
    app: datacenter-on-premise-principal
  ports:
  - port: 80
    targetPort: 80
---
