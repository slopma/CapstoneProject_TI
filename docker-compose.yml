services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudmove-backend
    restart: always
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - INVENTORY_PATH=/app/inventory/onprem-example.json
      - AWS_OUTPUT_PATH=/app/generated/aws/main.tf
      - CLOUDMOVE_API_URL=${CLOUDMOVE_API_URL:-}
      - CLOUDMOVE_ALLOW_SERVER_AWS_FALLBACK=${CLOUDMOVE_ALLOW_SERVER_AWS_FALLBACK:-false}
    volumes:
      - ./backend/data:/app/data
      - ./generated:/app/generated
      - ./inventory:/app/inventory
      - ./cloudmove_agent:/app/cloudmove_agent:ro
      - ./cloudmove_osquery_export.py:/app/cloudmove_osquery_export.py:ro
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudmove-frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
